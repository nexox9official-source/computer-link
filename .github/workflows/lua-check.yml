name: Lua Syntax Check

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.lua"
      - ".github/workflows/lua-check.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Check Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.3 -p "$file"
          done < <(find . -type f -name '*.lua' -print0)
