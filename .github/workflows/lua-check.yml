name: Lua Syntax Check

on:
  push:
    branches: [ "main", "ui/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - "**/*.lua"
      - ".github/workflows/lua-check.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Check Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.3 -p "$file"
          done < <(find . -type f -name '*.lua' -print0)
      - name: Test shell layouts and workspace interactions
        run: |
          lua5.3 tests/shell_layout.lua
          lua5.3 tests/workspace.lua
          lua5.3 tests/malcraft_agent.lua
          lua5.3 tests/malcraft_service.lua

      - name: Collect UI frame previews
        if: always()
        run: |
          mkdir -p test-output
          cp /tmp/linkos-*.frame test-output/ 2>/dev/null || true

      - name: Reject truncated primary UI labels
        run: |
          set -euo pipefail
          for frame in \
            linkos-launcher.frame \
            linkos-store.frame \
            linkos-settings.frame \
            linkos-files.frame \
            linkos-messages.frame \
            linkos-calculator.frame \
            linkos-task-switcher.frame; do
            path="test-output/$frame"
            [ -f "$path" ] || continue
            if grep -n '~' "$path"; then
              echo "Truncated UI text found in $frame"
              exit 1
            fi
          done

      - name: Upload UI frame previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkos-ui-frames
          path: test-output
          if-no-files-found: ignore
          retention-days: 7
