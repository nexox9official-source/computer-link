name: Build Malcraft Bridge

on:
  push:
    branches: [ "main" ]
    paths:
      - "malcraft-bridge/**"
      - ".github/workflows/malcraft-bridge.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Build
        working-directory: malcraft-bridge
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: malcraft-bridge-1.20.1
          path: malcraft-bridge/build/libs/*.jar
