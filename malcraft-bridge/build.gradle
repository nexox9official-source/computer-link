plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.11.0'
group = 'net.astralium.malcraft'

base {
    archivesName = 'malcraft-bridge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    maven { url = 'https://maven.squiddev.cc' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    compileOnly 'cc.tweaked:cc-tweaked-1.20.1-common-api:1.120.2'
    compileOnly fg.deobf('cc.tweaked:cc-tweaked-1.20.1-core-api:1.120.2')
    compileOnly fg.deobf('cc.tweaked:cc-tweaked-1.20.1-forge-api:1.120.2')
    runtimeOnly fg.deobf('cc.tweaked:cc-tweaked-1.20.1-forge:1.120.2')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : 'malcraft-bridge',
            'Specification-Vendor'    : 'Astralium',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'Astralium'
        ])
    }
    finalizedBy 'reobfJar'
}
